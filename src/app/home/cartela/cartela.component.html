<div class="container">
  
  <img [src]="srcBase64">
  
  <h2 >Escolha seus números (1 a {{totalNumeros()}})</h2>
      
  <div class="cartela-grid">
    <button 
      *ngFor="let num of numeros" 
      class="numero-btn"
      [class.destaque]="estaSelecionado(num.valor)"
      [ngClass]="{
        'em-analise': num.status === 'em-analise',
        'comprado': num.status === 'comprado',
        'destaque': num.selecionado && num.status === 'disponivel'
      }"
      [disabled]="num.status === 'em-analise' || num.status === 'comprado'"
      (click)="alternarNumero(num.valor); verificarSelecao(num.valor)"
      
    >          
          {{ num.status !== 'comprado' ? num.valor : 'X' }}
        
    </button>
  </div>
<div class="painel-compra">
    <button class="btn-limpar" (click)="limpar()">Limpar Seleção</button>
    <button class="btn-comprar" [disabled]="rifaService.numerosSelecionados.length === 0" (click)="irParaCompra()">
      Comprar ({{ rifaService.numerosSelecionados.length }})
    </button>
  </div>

</div>
